<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel Relay ESP32</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0f15;
      --panel: rgba(255, 255, 255, .95);
      --ink: #0a0f15;
      --muted: #3f4d5a;
      --line: #0a0f15;
      --orange: #ff8a00;
      --green: #2ecc71;
      --orange-soft: #ffb347;
      --blue: #0a6fd6;
      --blue-soft: #d6eaff;
      --alert: #d6320f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      font-family: "Chakra Petch", system-ui, sans-serif;
      color: var(--ink);
      background: #e9eef3;
      min-height: 100vh;
      padding: 24px 16px 56px;
      position: relative;
    }

    /* Latar: foto PCB TV tabung, tajam dan terang */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("bg-tv.png") center / cover no-repeat;
      filter: blur(3px) brightness(1.12) contrast(1.05) saturate(1.2);
      transform: scale(1.05);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 40%),
        linear-gradient(135deg, rgba(10, 111, 214, .14), rgba(255, 138, 0, .10));
    }

    main {
      max-width: 920px;
      margin: 0 auto;
    }

    header {
      background: var(--black);
      color: #fff;
      border-bottom: 5px solid var(--orange);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: .01em;
    }

    h1 span {
      color: var(--orange);
    }

    .sub {
      color: #b9c7d4;
      margin: 4px 0 0;
      font-size: .95rem;
    }

    /* Kartu status ESP32 */
    .status {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      background: var(--panel);
      border: 2px solid var(--line);
      border-left: 10px solid var(--muted);
      border-radius: 6px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .status[data-state="online"] {
      border-left-color: var(--blue);
    }

    .status[data-state="offline"] {
      border-left-color: var(--alert);
    }

    .lamp {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #aab6c1;
      border: 3px solid var(--black);
    }

    .status[data-state="online"] .lamp {
      background: var(--blue);
      box-shadow: 0 0 16px 4px rgba(10, 111, 214, .5);
    }

    .status[data-state="offline"] .lamp {
      background: var(--alert);
      box-shadow: 0 0 16px 4px rgba(214, 50, 15, .5);
      animation: blink 1.4s steps(2, jump-none) infinite;
    }

    @keyframes blink {
      50% {
        opacity: .5;
      }
    }

    .state-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0;
    }

    .status[data-state="online"] .state-title {
      color: var(--blue);
    }

    .status[data-state="offline"] .state-title {
      color: var(--alert);
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 28px;
      margin-top: 8px;
    }

    .fact small {
      display: block;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 500;
    }

    .fact b {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 1.08rem;
    }

    .fact.down b {
      color: var(--alert);
    }

    .notice {
      display: none;
      margin: -4px 0 16px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #fff1ec;
      border: 2px solid var(--alert);
      color: #7a1c07;
      font-weight: 500;
      font-size: .93rem;
    }

    .notice.show {
      display: block;
    }

    .bulk {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .bulk button {
      font: inherit;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 5px;
      cursor: pointer;
      border: 2px solid var(--black);
    }

    #allOn {
      background: var(--orange);
      color: var(--black);
    }

    #allOff {
      background: var(--black);
      color: #fff;
    }

    .bulk button:hover {
      filter: brightness(1.08);
    }

    /* Panel relay: kontras tinggi */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 680px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .relay {
      font: inherit;
      color: var(--black);
      text-align: left;
      cursor: pointer;
      background: #ffffff;
      border: 3px solid var(--black);
      border-radius: 6px;
      padding: 14px;
      min-height: 134px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 4px 4px 0 var(--black);
    }

    .relay:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .relay .name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .relay .state {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;
    }

    .track {
      margin-top: auto;
      width: 62px;
      height: 30px;
      border-radius: 4px;
      background: #c9d2db;
      border: 2px solid var(--black);
      position: relative;
    }

    .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 2px;
      background: var(--black);
      transition: transform .15s;
    }

    .relay[aria-checked="true"] .state {
      color: var(--black);
    }

    .relay[aria-checked="true"] .track {
      background: var(--green);
    }

    .relay[aria-checked="true"] .track::after {
      transform: translateX(32px);
      background: var(--black);
    }

    .relay:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--black);
    }

    .relay:focus-visible,
    .bulk button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }

    .msg {
      margin-top: 14px;
      min-height: 1.4em;
      color: var(--alert);
      font-weight: 600;
      font-size: .95rem;
    }

    /* Notifikasi saat status berubah */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 20px);
      padding: 12px 22px;
      border-radius: 6px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      background: #fff;
      border: 3px solid var(--black);
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.on {
      background: var(--blue);
      color: #fff;
    }

    .toast.off {
      background: var(--alert);
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {

      .lamp,
      .toast,
      .track::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Panel <span>Relay</span></h1>
      <p class="sub">Kontrol 8 relay ESP32 lewat Firebase</p>
    </header>

    <section class="status" id="status" data-state="connecting" aria-live="polite">
      <div class="lamp" aria-hidden="true"></div>
      <div>
        <p class="state-title" id="stateTitle">Menghubungkan ke Firebase</p>
        <div class="facts">
          <div class="fact"><small>Terakhir online</small><b id="lastSeen">-</b></div>
          <div class="fact down" id="downBox" hidden><small>Offline selama</small><b id="downFor">-</b></div>
          <div class="fact" id="agoBox" hidden><small>Data terakhir masuk</small><b id="agoFor">-</b></div>
        </div>
      </div>
    </section>

    <div class="notice" id="notice">ESP32 sedang offline. Perintah tetap tersimpan di Firebase dan dijalankan begitu
      ESP32 online kembali.</div>

    <div class="bulk">
      <button id="allOn" type="button">Nyalakan semua</button>
      <button id="allOff" type="button">Matikan semua</button>
    </div>

    <div class="grid" id="grid"></div>
    <p class="msg" id="msg" role="status"></p>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {getAuth, signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {getDatabase, ref, onValue, set, update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ======= ISI DENGAN KONFIGURASI PROJECT FIREBASE ANDA =======
    const firebaseConfig = {
      apiKey: "AIzaSyAzGMBflFZTmpGZDB87mJ2YzpikKVnNJpo",
      authDomain: "tvtabung-1b184.firebaseapp.com",
      databaseURL: "https://tvtabung-1b184-default-rtdb.firebaseio.com",
      projectId: "tvtabung-1b184",
      appId: "1:182353591913:web:58685a4629ac8ca09aacf8"
    };
    // =============================================================

    const RELAY_COUNT = 8;
    const OFFLINE_AFTER_MS = 15000;   // ESP kirim timestamp tiap 5 detik

    const $ = id => document.getElementById(id);
    const grid = $("grid"), msg = $("msg"), statusEl = $("status");
    const buttons = [];

    for (let i = 1; i <= RELAY_COUNT; i++) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "relay"; b.disabled = true;
      b.setAttribute("role", "switch"); b.setAttribute("aria-checked", "false");
      b.innerHTML = `<span class="name">Relay ${i}</span><span class="state">Mati</span><span class="track"></span>`;
      grid.appendChild(b); buttons.push(b);
    }
    const render = (i, on) => {
      buttons[i].setAttribute("aria-checked", String(on));
      buttons[i].querySelector(".state").textContent = on ? "Menyala" : "Mati";
    };
    const showError = e => {msg.textContent = "Gagal mengirim perintah: " + (e && e.message ? e.message : e);};

    function fmtDur(ms) {
      let s = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(s / 86400); s %= 86400;
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60); s %= 60;
      const parts = [];
      if (d) parts.push(d + " hari");
      if (d || h) parts.push(h + " jam");
      if (d || h || m) parts.push(m + " mnt");
      parts.push(s + " dtk");
      return parts.join(" ");
    }

    let toastTimer;
    function toast(text, kind) {
      const t = $("toast");
      t.textContent = text; t.className = "toast show " + kind;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
    }

    // ---- Status ESP32: logika penentu terakhir online ----
    let lastTimestamp = 0;
    let lastChangeTime = 0;       // ms (epoch) kapan data dari ESP terakhir berubah
    let prevOnline = null;

    function tick() {
      if (!lastChangeTime) return;
      const age = Date.now() - lastChangeTime;
      const online = age < OFFLINE_AFTER_MS;

      statusEl.dataset.state = online ? "online" : "offline";
      $("stateTitle").textContent = online ? "ESP32 Online" : "ESP32 Offline";
      $("lastSeen").textContent = new Date(lastChangeTime).toLocaleString("id-ID", {dateStyle: "medium", timeStyle: "medium"});
      $("downBox").hidden = online;
      $("agoBox").hidden = !online;
      $("notice").classList.toggle("show", !online);
      if (online) $("agoFor").textContent = fmtDur(age) + " lalu";
      else $("downFor").textContent = fmtDur(age);

      if (prevOnline !== null && prevOnline !== online) {
        toast(online ? "ESP32 kembali online" : "ESP32 terputus (offline)", online ? "on" : "off");
      }
      prevOnline = online;
    }

    try {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      await signInAnonymously(getAuth(app));
      buttons.forEach(b => b.disabled = false);

      // Relay (real-time)
      onValue(ref(db, "relays"), snap => {
        const v = snap.val() || {};
        for (let i = 0; i < RELAY_COUNT; i++) render(i, v["r" + (i + 1)] === true);
      }, showError);

      buttons.forEach((b, i) => b.addEventListener("click", () => {
        msg.textContent = "";
        set(ref(db, "relays/r" + (i + 1)), b.getAttribute("aria-checked") !== "true").catch(showError);
      }));
      const setAll = on => {
        msg.textContent = "";
        const data = {}; for (let i = 1; i <= RELAY_COUNT; i++) data["r" + i] = on;
        update(ref(db, "relays"), data).catch(showError);
      };
      $("allOn").addEventListener("click", () => setAll(true));
      $("allOff").addEventListener("click", () => setAll(false));

      // Status ESP32
      const statusRef = ref(db, "status");
      onValue(statusRef, snap => {
        const d = snap.val();
        if (!d) {$("stateTitle").textContent = "ESP32 belum pernah mengirim data"; statusEl.dataset.state = "offline"; return;}

        if (d.timestamp) {
          // Jika ini data pertama ATAU nilai timestamp dari Firebase berubah
          if (lastTimestamp === 0 || d.timestamp !== lastTimestamp) {
            lastTimestamp = d.timestamp;
            lastChangeTime = ((d.timestamp * 1000) - (25200000)); // timestamp WIB (UTC+7) dikembalikan ke waktu UTC
            tick();
          }
        }
      }, showError);

      setInterval(tick, 1000);
    } catch (e) {
      statusEl.dataset.state = "offline";
      $("stateTitle").textContent = "Tidak terhubung ke Firebase";
      msg.textContent = "Periksa firebaseConfig dan aktifkan Anonymous Auth. Detail: " + (e.message || e);
    }
  </script>
</body>

</html>
